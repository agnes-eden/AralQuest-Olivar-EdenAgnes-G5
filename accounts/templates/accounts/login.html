{% extends 'accounts/base.html' %}

{% block title %}Log in | AralQuest{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in to AralQuest</h1>
    <p class="muted">Use your username and password to continue.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button button-primary" type="submit">Log in</button>
    </form>
    <p class="form-footnote">New to AralQuest? <a href="{% url 'register' %}">Create an account</a>.</p>
</section>
{% endblock %}
